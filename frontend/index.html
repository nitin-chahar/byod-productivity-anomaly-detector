<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYOD Sentinel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <span class="brand-icon">🛡️</span>
                <span class="brand-title">BYOD Sentinel</span>
            </div>

            <div class="nav-actions">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="theme-icon" id="themeIcon">☀️</span>
                </button>
                <button class="btn btn-secondary btn-sm" id="btnQuickSimulate">
                    <span>⚡</span> Simulate
                </button>
            </div>
        </div>
    </header>

    <main class="main-layout">
        <!-- Minimal Metrics Overview -->
        <section class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Total Visits</div>
                <div class="metric-value" id="kpiTotalVisits">--</div>
            </div>

            <div class="metric-card">
                <div class="metric-title">Productive Ratio</div>
                <div class="metric-value" id="kpiProductivityRatio">--%</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="productivityProgressBar" style="width: 0%;"></div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">Alerts Flagged</div>
                <div class="metric-value alert-text" id="kpiTotalAlerts">--</div>
            </div>
        </section>

        <!-- Two-Column Workspace -->
        <div class="dashboard-columns">
            <!-- Left: Log Form -->
            <div class="column-left">
                <div class="card">
                    <div class="card-header">
                        <h2>Log Browsing Session</h2>
                    </div>

                    <!-- Presets -->
                    <div class="presets-section">
                        <div class="presets-wrapper">
                            <button type="button" class="preset-chip chip-alert" data-user="101" data-url="https://www.youtube.com/wwe" data-time="450" data-email="try.nitinchahar@gmail.com">
                                🔴 YouTube: WWE (Alert)
                            </button>
                            <button type="button" class="preset-chip chip-alert" data-user="102" data-url="https://www.instagram.com" data-time="600" data-email="try.nitinchahar@gmail.com">
                                🔴 Instagram (Alert)
                            </button>
                            <button type="button" class="preset-chip chip-prod" data-user="103" data-url="https://www.youtube.com/watch?v=1L420xXpDTg" data-time="500" data-email="try.nitinchahar@gmail.com">
                                🟢 YouTube: ML Course (Productive)
                            </button>
                            <button type="button" class="preset-chip chip-prod" data-user="104" data-url="https://www.github.com" data-time="300" data-email="try.nitinchahar@gmail.com">
                                🟢 GitHub (Productive)
                            </button>
                        </div>
                    </div>

                    <form id="logForm">
                        <div class="form-row">
                            <div class="form-group flex-1">
                                <label for="user_id">User ID</label>
                                <input type="number" id="user_id" placeholder="101" required min="1" value="101">
                            </div>
                            <div class="form-group flex-1">
                                <label for="time_spent">Time Spent (Seconds)</label>
                                <input type="number" id="time_spent" placeholder="450" required min="1" value="450">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="url">Website URL</label>
                            <input type="url" id="url" placeholder="https://example.com" required value="https://www.youtube.com/wwe">
                        </div>

                        <div class="form-group">
                            <label for="email">Alert Email</label>
                            <input type="email" id="email" placeholder="student@university.edu" required value="try.nitinchahar@gmail.com">
                        </div>

                        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                            <span id="btnText">Log Visit</span>
                            <span id="btnSpinner" class="spinner" style="display: none;"></span>
                        </button>
                    </form>

                    <div id="responseMessage" class="response-box" style="display: none;"></div>
                </div>
            </div>

            <!-- Right: Activity Feed -->
            <div class="column-right">
                <div class="card stream-card">
                    <div class="stream-header">
                        <h2>Activity Stream</h2>
                        <div class="tab-filters">
                            <button class="tab-btn active" data-filter="all">All</button>
                            <button class="tab-btn" data-filter="alerts">Alerts</button>
                            <button class="tab-btn" data-filter="productive">Productive</button>
                            <button class="tab-btn" data-filter="anomalies">Anomalies</button>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>URL</th>
                                    <th>Category</th>
                                    <th>Duration</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="logsTableBody">
                                <tr>
                                    <td colspan="5" class="table-empty">Loading records...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="stream-footer">
                        <span id="logsCountText">0 entries</span>
                        <button class="btn btn-ghost btn-xs" id="btnRefreshLogs">↻ Refresh</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
</body>
</html>
