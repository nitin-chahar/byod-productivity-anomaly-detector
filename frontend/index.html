<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYOD Productivity Logger & Anomaly Monitor</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="badge">Enterprise & EdTech Edition</div>
        <h1>BYOD Productivity Logger</h1>
        <p class="subtitle">Log browsing activity for real-time NLP classification & anomaly detection</p>
        
        <form id="logForm">
            <label for="user_id">Student / User ID</label>
            <input type="number" id="user_id" placeholder="e.g. 101" required min="1">

            <label for="url">Website URL</label>
            <input type="url" id="url" placeholder="https://example.com" required>

            <label for="time_spent">Time Spent (seconds)</label>
            <input type="number" id="time_spent" placeholder="e.g. 120" required min="1">

            <label for="email">Notification Email</label>
            <input type="email" id="email" placeholder="student@university.edu" required>

            <button type="submit" id="submitBtn">
                <span id="btnText">Log Activity Visit</span>
                <span id="btnSpinner" class="spinner" style="display: none;"></span>
            </button>
        </form>

        <div id="responseMessage"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
